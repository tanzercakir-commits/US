[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-semantic-verifier"
version = "0.1.0"
description = "Restricted deterministic C++ semantic verifier"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
semantic-verify = "semantic_verifier.cli:main"

[tool.setuptools]
packages = ["semantic_verifier"]

[tool.setuptools.package-data]
semantic_verifier = [
  "memory_ir_schema/v7/*.json",
  "project_index_schema/v1/*.json",
  "project_manifest_schema/v1/*.json",
  "prompt_packs/contract_proposal/v1/*.json",
  "prompt_packs/contract_proposal/v1/*.md",
]
